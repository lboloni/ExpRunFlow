[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "exprunflow"
version = "0.2.0"
description = "Parameterize and run scientific experiment flows with exp/runs."
requires-python = ">=3.10"
dependencies = ["pyyaml", "numpy", "torch"]

[project.optional-dependencies]
flow = ["papermill>=2.7,<3", "tqdm>=4.67,<5", "ipython"]
# replications: the aggregation (exprunflow.aggregate) and its figures (exprunflow.plots)
analysis = ["pandas>=2", "scipy>=1.10"]
plots = ["matplotlib>=3.7"]

[tool.setuptools]
packages = ["exprunflow"]
